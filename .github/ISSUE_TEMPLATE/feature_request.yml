name: Feature request
description: An idea that would make murmur more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: The change you have in mind. Rough ideas are fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
