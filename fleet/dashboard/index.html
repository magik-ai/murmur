<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>murmur</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
<link rel="stylesheet" href="/static/app.css">
<script>
  // Apply the stored theme before the first paint, so a dark page never flashes light.
  try {
    var stored = localStorage.getItem("murmur.theme");
    if (stored === "light" || stored === "dark") document.documentElement.setAttribute("data-theme", stored);
  } catch (error) { /* a browser with storage switched off keeps the system theme */ }
</script>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div id="app">
  <aside id="sidebar" aria-label="Sections">
    <div class="side-head">
      <span class="mark" aria-hidden="true"></span>
      <span class="mark-name" id="sidebarTitle">murmur</span>
    </div>
    <nav id="navlinks"></nav>
    <div class="side-foot"><span id="versionLabel" class="muted"></span></div>
  </aside>

  <header id="topbar">
    <h1 id="productTitle">murmur</h1>
    <span class="crumb-sep" aria-hidden="true">/</span>
    <span id="viewTitle" class="crumb"></span>
    <div class="top-right">
      <span id="capacity" class="pill" title=""><span class="dot"></span><span class="pill-text">capacity</span></span>
      <label class="field">
        <span class="sr-only">Project filter</span>
        <select id="projectFilter"><option value="">All projects</option></select>
      </label>
      <span id="freshness" class="freshness" aria-live="polite"></span>
      <button id="paletteOpen" class="ghost-button" aria-label="Search">Search <kbd>&#8984;K</kbd></button>
      <button id="themeSwitch" class="icon-button" aria-label="Theme: system"></button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>
</div>

<div id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer-head">
    <div><h2 id="drawerTitle"></h2><p id="drawerSub" class="muted"></p></div>
    <button id="drawerClose" class="ghost-button" aria-label="Close">Close</button>
  </div>
  <div id="drawerBody" class="drawer-body"></div>
</div>
<div id="drawerScrim" class="scrim" hidden></div>

<div id="palette" class="palette" hidden role="dialog" aria-modal="true" aria-label="Jump to">
  <div class="palette-box">
    <input id="paletteInput" type="text" autocomplete="off" spellcheck="false" role="combobox"
      aria-controls="paletteList" aria-expanded="true" aria-autocomplete="list"
      aria-label="Jump to a tab, an agent, a project or a mailbox"
      placeholder="Jump to a tab, an agent, a project, a mailbox">
    <ul id="paletteList" role="listbox"></ul>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
