<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%9A%9C%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d1017; --panel:#161b24; --panel2:#1d232e; --line:#262d3a;
    --ink:#e6e9ef; --dim:#8a93a3; --ok:#3fb950; --warn:#d29922; --block:#f85149;
    --accent:#5b8def; --env:#a371f7; --divergent:#f778ba;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --card-w:260px; --pane-gutter:16px; --splitter-hit:10px; --pane-scrollbar-w:0px;
    --pane-min-w:calc(var(--card-w) + 2 * var(--pane-gutter) + var(--pane-scrollbar-w));
  }
  @media (prefers-color-scheme:light){:root{
    --bg:#f4f6fa;--panel:#fff;--panel2:#f0f3f8;--line:#e2e7ef;--ink:#1a1f28;--dim:#5a6675;
    --divergent:#b42375;
  }}
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
  [hidden]{display:none!important}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);flex:0 0 auto;overflow-x:auto}
  header h1{font-size:15px;margin:0;letter-spacing:.3px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.block{background:var(--block)}
  .wrap{padding:18px 20px;width:100%;max-width:1800px;margin:0 auto;flex:1 1 auto;min-height:0;overflow:hidden}
  #fleetview,#modelsview{height:100%;min-height:0}
  #fleetview{display:flex;flex-direction:column}
  #modelsview{overflow-y:auto}
  .fleet-split{flex:1 1 auto;min-height:0;display:flex;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
  .pane{min-width:var(--pane-min-w);min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;background:var(--bg)}
  .agents-pane{flex:0 0 42%}
  .ci-pane{flex:1 1 auto}
  .panehead{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px;padding:13px var(--pane-gutter) 11px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .panehead h2{font-size:12px;text-transform:uppercase;letter-spacing:.7px;margin:0}
  .panehint{margin-left:auto;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
  .panecontent{padding:14px var(--pane-gutter) var(--pane-gutter)}
  .splitter{position:relative;z-index:6;flex:0 0 var(--splitter-hit);width:var(--splitter-hit);cursor:col-resize;touch-action:none;outline:none;background:var(--bg)}
  .splitter::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;transform:translateX(-.5px);background:var(--line);transition:background .12s,box-shadow .12s}
  .splitter:hover::after,.splitter:focus-visible::after,.splitter.active::after{background:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
  body.resizing{user-select:none;cursor:col-resize}
  .fleet-split.stacked{flex-direction:column}
  .fleet-split.stacked .pane{min-width:0;width:100%!important;flex:1 1 50%!important;min-height:min(320px,50%)}
  .fleet-split.stacked .splitter{display:none}
  /* auto-fit stretches whatever tiles are present to fill the row evenly (the CPU/GPU
     tiles can be absent), so metrics stay even without a fixed column count. */
  /* subscription tiles reuse .tile wholesale; only the three-limit innards and the vendor
     mark in the corner are their own */
  .alims{display:flex;gap:16px;margin-top:4px}
  .alim{display:flex;flex-direction:column;gap:1px}
  .alim .lk{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
  .alim .lv{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
  .alim .lv.warn{color:var(--warn)} .alim .lv.bad{color:var(--block)}
  .alim .lr{color:var(--dim);font-size:10px;font-variant-numeric:tabular-nums}
  .tile .elogo{position:absolute;right:11px;bottom:9px;width:17px;height:17px;opacity:.6}
  .health{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
  .tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;min-height:80px}
  .ledot{position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
  .ledot.warn{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
  .ledot.bad{background:var(--block);box-shadow:0 0 0 3px color-mix(in srgb,var(--block) 22%,transparent)}
  .tile .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .tile .v{font-size:22px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .v small{font-size:12px;color:var(--dim);font-weight:400}
  .bar{height:5px;border-radius:3px;background:var(--panel2);margin-top:auto;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .tile.warn .v{color:var(--warn)} .tile.bad .v{color:var(--block)}
  .tile.warn .bar>i{background:var(--warn)} .tile.bad .bar>i{background:var(--block)}
  .tile.warn{border-color:var(--warn)} .tile.bad{border-color:var(--block)}
  .cards,.ci-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--card-w)),1fr));gap:12px}
  .ci-grid{align-items:start}
  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;border-left:3px solid var(--dim);cursor:pointer;display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .card:hover{border-color:var(--accent)}
  .filters{display:flex;align-items:center;gap:0;margin-bottom:14px;overflow-x:auto}
  .filters:empty{display:none}
  .fgroup{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .fspacer{flex:1 1 auto;min-width:24px}
  .fchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font:500 12px/1 inherit;color:var(--dim);cursor:pointer}
  .fchip:hover{color:var(--ink)}
  .fchip.on{color:var(--ink)}
  .fdot{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;margin-left:-3px}
  .fsdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .fchip .fct{color:var(--dim);font-variant-numeric:tabular-nums}
  .fchip.on .fct{color:var(--ink)}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px;min-height:16px}
  .elogo{width:17px;height:17px;opacity:.6;flex-shrink:0}
  .cilights{display:inline-flex;gap:5px;align-items:center}
  .cilight{width:8px;height:8px;border-radius:50%;background:var(--dim);opacity:.4}
  .cilight.pass{background:var(--ok);opacity:1}
  .cilight.fail{background:var(--block);opacity:1}
  .cilight.pend{background:var(--warn);opacity:1;animation:cipulse 1.4s ease-in-out infinite}
  @keyframes cipulse{50%{opacity:.35}}
  .card .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .ident{display:flex;align-items:center;gap:9px;min-width:0}
  .ico{width:27px;height:27px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;border:1px solid transparent;flex-shrink:0}
  .card .slug{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .st{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);flex-shrink:0;font-weight:600}
  .card.running .st{color:var(--accent)} .card.pr_open .st{color:var(--ok)}
  .card.failed .st{color:var(--block)} .card.done_no_pr .st,.card.ended .st{color:var(--warn)}
  .card.state_unreadable .st{color:var(--block)}
  .meta{color:var(--dim);font-size:12px;margin-top:4px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px;font-family:var(--mono)}
  .chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
  .chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
  .card .alarm{margin-top:7px;font-size:11px;font-weight:600;color:var(--block);font-family:var(--mono)}
  .act{margin-top:9px;font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .empty{grid-column:1/-1;min-height:55vh;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:15px}
  .pane .empty{min-height:160px;padding:24px}
  .ci-empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;margin-bottom:18px}
  .ci-empty[hidden]{display:none!important}
  .cisection{margin-bottom:22px}
  .cisection:last-child{margin-bottom:0}
  .cisection h3{margin:0 0 9px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:7px}
  .cisection-toggle{width:100%;margin:0;padding:0;border:0;background:none;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;display:flex;align-items:center;gap:7px;cursor:pointer;text-align:left}
  .cisection-toggle::after{content:"›";margin-left:auto;font-size:18px;line-height:1;transition:transform .12s}
  .cisection-toggle[aria-expanded="true"]::after{transform:rotate(90deg)}
  .cisection-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:3px}
  .count{display:inline-flex;min-width:19px;height:19px;padding:0 5px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;font-size:10px;font-variant-numeric:tabular-nums}
  .ci-card{position:relative;display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--dim);border-radius:12px;padding:13px}
  .ci-card.expanded{grid-column:1/-1}
  .ci-card:hover,.ci-card:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
  .ci-card-toggle{cursor:pointer;outline:none}
  .ci-card.stale{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 38%,transparent)}
  .ci-card.divergent{border-color:var(--divergent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--divergent) 42%,transparent)}
  .ci-card.running{border-left-color:var(--accent)}
  .ci-card.passed{border-left-color:var(--ok)}
  .ci-card.passed_partial{border-left-color:var(--warn)}
  .ci-card.failed,.ci-card.conflict{border-left-color:var(--block)}
  .ci-card.ejected,.ci-card.cancelled{border-left-color:var(--dim)}
  /* blocked = this machine could not verify. Amber, not red: nothing is known to be wrong. */
  .ci-card.blocked{border-left-color:var(--warn)}
  .ci-card.blocked .cistate{color:var(--warn)}
  .citop{display:flex;align-items:flex-start;gap:10px}
  .cipr{font-weight:650;font-size:13px}
  .cibranch{display:block;color:var(--dim);font:11px/1.35 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .cistate{margin-left:auto;font-size:10px;text-transform:uppercase;letter-spacing:.55px;color:var(--dim);font-weight:700;flex-shrink:0}
  .ci-card.running .cistate{color:var(--accent)}
  .ci-card.passed .cistate{color:var(--ok)}
  .ci-card.passed_partial .cistate{color:var(--warn)}
  .ci-card.failed .cistate,.ci-card.conflict .cistate{color:var(--block)}
  .ci-card.ejected .cistate,.ci-card.cancelled .cistate{color:var(--dim)}
  .cimeta{color:var(--dim);font-size:11px;margin-top:8px}
  .ciflags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .ciflag{display:inline-flex;border:1px solid currentColor;border-radius:5px;padding:2px 6px;font:700 9px/1.4 var(--mono);text-transform:uppercase}
  .ciflag.stale{color:var(--warn)}
  .ciflag.divergent{color:var(--divergent);background:color-mix(in srgb,var(--divergent) 10%,transparent)}
  .tierline{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .tier{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:2px 6px;font:10px/1.35 var(--mono);color:var(--dim)}
  .tier.passed,.tier.pass{color:var(--ok)}
  .tier.running{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
  .tier.failed,.tier.fail{color:var(--block)}
  .tier.pending,.tier.queued{color:var(--dim)}
  .tier.skipped{color:var(--dim);opacity:.72}
  .tierline.passed_partial .tier.passed,.tierline.passed_partial .tier.pass{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
  .tierline.ejected .tier,.tierline.cancelled .tier{color:var(--dim);border-color:var(--line);opacity:.72}
  .cireason{margin-top:9px;color:var(--ink);font-size:11px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cireason b{font-family:var(--mono);font-size:10px}
  .failurekind{display:inline-flex;margin-right:5px;border:1px solid currentColor;border-radius:5px;padding:1px 5px;color:var(--block);font:700 9px/1.4 var(--mono);text-transform:uppercase}
  .failurekind.environment{color:var(--env)}
  .failurekind.conflict{color:var(--block)}
  .cireason.partial{color:var(--warn)}
  .muted{color:var(--dim);font-size:12px;margin-left:auto}
  .sweepind{color:var(--dim);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .ro{color:#d29922;border:1px solid #d29922;border-radius:999px;padding:1px 8px;font-size:11px;white-space:nowrap;letter-spacing:.04em}
  body.readonly .modeseg button,body.readonly .autobtn,body.readonly .acct-rm,body.readonly #acct-add-btn,body.readonly [data-act]{opacity:.45;cursor:not-allowed}
  .modewrap{display:flex;align-items:center;gap:10px}
  .modelabel{color:var(--dim);font-size:11px;white-space:nowrap}
  .autobtn{background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;font:600 11px/1 inherit}
  .autobtn:hover{color:var(--ink)}
  .autobtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .scale{display:flex;align-items:center;gap:6px}
  .scaleicon{font-size:14px;opacity:.75;cursor:default;line-height:1}
  .modeseg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .modeseg button{background:var(--panel);color:var(--dim);border:0;border-left:1px solid var(--line);padding:5px 9px;cursor:pointer;font:600 11px/1 inherit;letter-spacing:.3px;font-variant-numeric:tabular-nums}
  .modeseg button:first-child{border-left:0}
  .modeseg button:hover{color:var(--ink);background:var(--panel2)}
  .modeseg button.on{background:var(--accent);color:#fff}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px 20px;z-index:50}
  .modal[hidden]{display:none}
  .modalp{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:660px;width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .modalh{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
  .modalh b{font-size:14px;word-break:break-all}
  .modalx{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--dim);cursor:pointer;padding:6px 12px;font:600 11px/1 inherit;flex-shrink:0}
  .modalx:hover{color:var(--ink)}
  .modalbody{overflow-y:auto;padding:18px 20px;flex:1;min-height:0}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:7px 14px;font-size:12px;margin:0}
  .kv dt{color:var(--dim)}
  .kv dd{margin:0;font-family:var(--mono);word-break:break-word}
  .modalsec{margin-top:16px;border-top:1px solid var(--line);padding-top:13px}
  .modalsec h4{margin:0 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
  .modalpre{font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px;color:var(--ink);max-height:200px;overflow:auto}
  .ci-detail{margin:12px -13px -13px;padding:14px 13px 15px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--panel2) 38%,var(--panel))}
  .ci-detail-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;margin:0}
  .ci-detail-meta>div{display:grid;grid-template-columns:82px minmax(0,1fr);gap:8px;font-size:11px}
  .ci-detail-meta dt{color:var(--dim)}
  .ci-detail-meta dd{margin:0;font-family:var(--mono);overflow-wrap:anywhere}
  .ciwarnings{display:grid;gap:7px;margin-top:15px}
  .ciwarning{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);border-radius:6px;padding:8px 10px;font-size:11px}
  .ciwarning.divergent{border-left-color:var(--divergent);background:color-mix(in srgb,var(--divergent) 9%,transparent)}
  .ci-stage-list{display:grid;gap:7px}
  .cistage{display:block;border:1px solid var(--line);border-radius:8px;background:var(--panel2);overflow:hidden}
  details.cistage>summary{list-style:none;cursor:pointer}
  details.cistage>summary::-webkit-details-marker{display:none}
  details.cistage>summary::after{content:"›";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:18px;line-height:1;transition:transform .12s}
  details.cistage[open]>summary::after{transform:translateY(-50%) rotate(90deg)}
  .cistagerow{position:relative;min-height:43px;padding:9px 32px 9px 11px;display:grid;grid-template-columns:20px minmax(105px,1fr) minmax(120px,1.5fr) auto auto;align-items:center;gap:8px}
  .stageicon{width:18px;height:18px;border:1px solid currentColor;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--dim);font:700 10px/1 var(--mono)}
  .cistage.passed .stageicon{color:var(--ok)}
  .cistage.running{border-color:color-mix(in srgb,var(--accent) 65%,var(--line));box-shadow:inset 3px 0 0 var(--accent)}
  .cistage.running .stageicon{color:var(--accent);animation:cipulse 1.4s ease-in-out infinite}
  .cistage.running .stagedesc,.cistage.running .stageduration{color:var(--accent)}
  .cistage.failed .stageicon{color:var(--block)}
  .cistage.skipped .stageicon,.cistage.queued .stageicon{color:var(--dim)}
  .stagename{font:600 11px/1.4 var(--mono);overflow-wrap:anywhere}
  .stagedesc{color:var(--dim);font-size:11px;overflow-wrap:anywhere}
  .stageduration{color:var(--dim);font:10px/1.4 var(--mono);white-space:nowrap}
  .stagekind{border:1px solid currentColor;border-radius:5px;padding:1px 5px;color:var(--block);font:700 9px/1.4 var(--mono);text-transform:uppercase}
  .stagekind.environment{color:var(--env)}
  .stagekind.conflict{color:var(--block)}
  .cistagebody{padding:10px 12px 12px 40px;border-top:1px solid var(--line);background:var(--panel);font-size:11px}
  .stagefailure{margin-bottom:9px;color:var(--ink)}
  .failedtests{margin:0 0 9px;padding-left:18px;color:var(--block);font:10px/1.55 var(--mono)}
  .failedtests li{padding:2px 0;overflow-wrap:anywhere}
  .failedempty{margin-bottom:9px;color:var(--dim);font-size:11px}
  .ciloghead{margin:10px 0 6px;color:var(--dim);font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
  .cilog{max-height:240px;margin:0;overflow:auto;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:9px 10px;color:var(--ink);font:10px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
  .cilog.loading,.cilog.missing{color:var(--dim)}
  .cilog.error{color:var(--block)}
  .uncovered{color:var(--warn);font:11px/1.45 var(--mono)}
  details.uncovered>summary{cursor:pointer;display:flex;align-items:center;gap:7px}
  .uncovered ul{margin:9px 0 0;padding-left:19px}

<script>
const $=id=>document.getElementById(id);

// Write access. The server refuses every mutating route without the dashboard token, loopback
// or not, and refuses a cross-site request whatever token it carries. On a wide bind the token
// covers reads too, so every GET here sends it as well. A browser cannot read an env var, so the
// token arrives once in the URL (?token=…), is kept for the tab, and is stripped back out of the
// address bar so it does not sit in a bookmark or a screenshot.
let WRITABLE=true, WRITEBLOCK='';
const DASH_TOKEN=(()=>{
  try{
    const q=new URLSearchParams(location.search).get('token');
    if(q){ sessionStorage.setItem('fleetDashToken',q);
           history.replaceState(null,'',location.pathname+location.hash); return q; }
    return sessionStorage.getItem('fleetDashToken')||'';
  }catch(_){ return ''; }
})();
function post(path,body){
  const headers={'Content-Type':'application/json'};
  if(DASH_TOKEN) headers['Authorization']='Bearer '+DASH_TOKEN;
  return fetch(path,{method:'POST',headers,body:JSON.stringify(body||{})});
}
// Every read goes through this, so a dashboard bound to a network still answers its own page.
function get(path){
  const headers=DASH_TOKEN?{'Authorization':'Bearer '+DASH_TOKEN}:{};
  return fetch(path,{headers});
}
async function refreshAccess(){
  try{
    const a=await get('/api/access').then(r=>r.json());
    WRITABLE=!!a.writable; WRITEBLOCK=a.reason||'';
  }catch(_){ /* an unreachable server is not a permission answer; leave the last one alone */ }
  const dot=$('rodot');
  if(dot){ dot.hidden=WRITABLE; dot.title=WRITEBLOCK||''; }
  document.body.classList.toggle('readonly',!WRITABLE);
}
// Every mutating handler calls this first, so a read-only page says why instead of firing a
// click that comes back 403 with nothing on screen.
function canWrite(){
  if(WRITABLE) return true;
  alert('This dashboard is read-only.'+(WRITEBLOCK?'\n\n'+WRITEBLOCK:''));
  return false;
}
const gb=n=>n==null?'–':n.toFixed?n.toFixed(1):n;
function ago(t){if(!t)return'';const s=Math.max(0,Math.floor(Date.now()/1000-t));if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m';return Math.floor(s/3600)+'h'+Math.floor(s%3600/60)+'m';}
function span(s){
  s=Math.max(0,Math.floor(Number(s)||0));
  if(s<60)return s+'s';
  if(s<3600)return Math.floor(s/60)+'m '+s%60+'s';
  return Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m';
}
function tile(k,v,sub,pct,lv){return `<div class="tile ${lv||''}"><span class="ledot ${lv||'ok'}"></span><div class="k">${k}</div><div class="v">${v}${sub?` <small>${sub}</small>`:''}</div>${pct!=null?`<div class="bar"><i style="width:${Math.min(100,pct)}%"></i></div>`:''}</div>`;}
// health level: '' ok / 'warn' / 'bad'. invert=true when LOWER is worse (e.g. RAM free).
function lvl(v,warn,bad,invert){if(v==null)return'';return invert?(v<=bad?'bad':v<=warn?'warn':''):(v>=bad?'bad':v>=warn?'warn':'');}
// identity belongs to the INITIATOR (spawned_by), not the individual agent:
// all of one orchestrator's agents share its emoji + colour. The emoji is the
// initiator's own (passed via `--icon`, e.g. spider=🕷); colour is derived from

const CREATURES=['🦊','🦉','🐢','🐝','🦋','🦈','🐙','🦅','🐺','🦁','🐬','🦕','🐸','🦎','🐳','🦇','🦜','🐡','🦩','🦥','🐧','🦦'];

  codex:`<svg class="elogo" viewBox="0 0 24 24" aria-label="OpenAI"><path fill="currentColor" d="M9.205 8.658v-2.26c0-.19.072-.333.238-.428l4.543-2.616c.619-.357 1.356-.523 2.117-.523 2.854 0 4.662 2.212 4.662 4.566 0 .167 0 .357-.024.547l-4.71-2.759a.797.797 0 00-.856 0l-5.97 3.473zm10.609 8.8V12.06c0-.333-.143-.57-.429-.737l-5.97-3.473 1.95-1.118a.433.433 0 01.476 0l4.543 2.617c1.309.76 2.189 2.378 2.189 3.948 0 1.808-1.07 3.473-2.76 4.163zM7.802 12.703l-1.95-1.142c-.167-.095-.239-.238-.239-.428V5.899c0-2.545 1.95-4.472 4.591-4.472 1 0 1.927.333 2.712.928L8.23 5.067c-.285.166-.428.404-.428.737v6.898zM12 15.128l-2.795-1.57v-3.33L12 8.658l2.795 1.57v3.33L12 15.128zm1.796 7.23c-1 0-1.927-.332-2.712-.927l4.686-2.712c.285-.166.428-.404.428-.737v-6.898l1.974 1.142c.167.095.238.238.238.428v5.233c0 2.545-1.974 4.472-4.614 4.472zm-5.637-5.303l-4.544-2.617c-1.308-.761-2.188-2.378-2.188-3.948A4.482 4.482 0 014.21 6.327v5.423c0 .333.143.571.428.738l5.947 3.449-1.95 1.118a.432.432 0 01-.476 0zm-.262 3.9c-2.688 0-4.662-2.021-4.662-4.519 0-.19.024-.38.047-.57l4.686 2.71c.286.167.571.167.856 0l5.97-3.448v2.26c0 .19-.07.333-.237.428l-4.543 2.616c-.619.357-1.356.523-2.117.523zm5.899 2.83a5.947 5.947 0 005.827-4.756C22.287 18.339 24 15.84 24 13.296c0-1.665-.713-3.282-1.998-4.448.119-.5.19-.999.19-1.498 0-3.401-2.759-5.947-5.946-5.947-.642 0-1.26.095-1.88.31A5.962 5.962 0 0010.205 0a5.947 5.947 0 00-5.827 4.757C1.713 5.447 0 7.945 0 10.49c0 1.666.713 3.283 1.998 4.448-.119.5-.19 1-.19 1.499 0 3.401 2.759 5.946 5.946 5.946.642 0 1.26-.095 1.88-.309a5.96 5.96 0 004.162 1.713z"/></svg>`
};
// Three CI lights = the three required jobs (backend/frontend/docker). Grey until the
// poller has data; then pass=green, fail=red, pending=amber (pulsing). Only shown once a
// PR exists (before that there's no CI to report).
const CI_JOBS=['backend','frontend','docker'];
function cilights(s){
  if(!s.pr_url) return '<span class="cilights"></span>';
  const ci=s.ci||{};
  return '<span class="cilights">'+CI_JOBS.map(k=>
    `<span class="cilight ${ci[k]||''}" title="${k}: ${ci[k]||'pending'}"></span>`).join('')+'</span>';
}
function hstr(x){x=x||'';let h=2166136261;for(let i=0;i<x.length;i++){h^=x.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
let IDENT={};  // code name -> {icon,colour}; the registry is the authority
function ident(s){
  const key=s.spawned_by||'';
  const reg=IDENT[key]||{};
  const h=hstr(key||s.slug||'');
  return{emoji:reg.icon||s.by_icon||CREATURES[h%CREATURES.length],
         color:reg.color||s.by_color||ACOLORS[h%ACOLORS.length]};
}

// Power selector as ONE axis: 🚜 farm  ←→  🖥️ your PC. The numbers are the farm's CPU
// share (100% at the farm end, 20% at the PC end — the PC gets the rest). Auto is a
// separate button (it slides along the axis for you off the GPU). Only the chosen stop
// is highlighted; a plain-English line says what's in force now.
const STOPS=[['full','100%'],['soft','50%'],['balanced','35%'],['hard','20%']]; // farm share, farm→PC
const TIP={
  auto:'Automatic — farm at full when your PC is idle, eases to 50% when you use it',
  full:'Farm uses all the CPU',
  soft:'Farm ~50% CPU — yields to your PC but keeps working',
  balanced:'Farm ~35% CPU — pauses new agents',
  hard:'Farm ~20% CPU — pauses new agents (most left for your PC)',
};
function renderMode(md){
  if(!md||md.error)return;
  const set=md.setting, eff=md.effective;
  const seg=STOPS.map(([k,lbl])=>
    `<button data-m="${k}" class="${k===set?'on':''}" title="${TIP[k]}">${lbl}</button>`).join('');
  const farm={full:'farm: full power',soft:'farm: 50% CPU',
    balanced:'farm: 35% · agents paused',hard:'farm: 20% · agents paused'}[eff];
  // Cores were never the whole story: the farm can yield every core and still be holding twenty
  // gigabytes, which is what the machine actually feels.
  const ram = md.mem_high_gb!=null
    ? `RAM capped at ${md.mem_high_gb}GB` + (md.ci_ram_released?' · test DB released':'')
    : 'RAM uncapped';
  const freeNote = md.ram_free_gb!=null ? ` · ${md.ram_free_gb}GB free of ${md.ram_total_gb}` : '';
  const label = set==='auto'
    ? (eff==='full' ? 'Auto · farm full (PC idle)' : `Auto · ${farm} (PC in use)`)
    : farm;
  $('modesel').innerHTML =
    `<span class="modelabel">${label}</span>`
    + `<span class="modelabel ram-note" style="opacity:.72">${ram}${freeNote}</span>`
    + `<button data-m="auto" class="autobtn ${set==='auto'?'on':''}" title="${TIP.auto}">Auto</button>`
    + `<div class="scale"><span class="scaleicon" title="all CPU to the farm">🚜</span>`
    + `<div class="modeseg">${seg}</div>`
    + `<span class="scaleicon" title="most CPU to your PC">🖥️</span></div>`;
}
$('modesel').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-m]'); if(!b)return;
  if(!canWrite())return;
  try{
    const md=await post('/api/mode',{mode:b.dataset.m}).then(r=>r.json());
    renderMode(md);
  }catch(_){}
});

// Agent detail uses the modal. CI details expand inline in their own pane below.
let AGENTS={}, OPEN=null, OPENJSON=null, OPENCI=null, MODALRETURN=null;
function fmtAbs(t){try{return t?new Date(t*1000).toLocaleString():'';}catch(_){return'';}}
function esc(x){return String(x==null?'':x).replace(/[&<]/g,c=>c==='&'?'&amp;':'&lt;');}
function kvrow(k,v){return (v==null||v==='')?'':`<dt>${k}</dt><dd>${esc(v)}</dd>`;}
async function openCard(slug){
  const base=AGENTS[slug]; if(!base){closeCard();return;}
  if(OPENCI){OPENCI=null;renderCI(true);}
  OPEN=slug; OPENJSON=JSON.stringify(base);
  const prev=$('modal').querySelector('.modalbody');      // keep scroll across live refresh
  const scroll=prev?prev.scrollTop:0;
  // full task/result live in the agent's log files (the list record truncates them)
  let s=base;
  try{ const d=await get('/api/agent?slug='+encodeURIComponent(slug)).then(r=>r.json()); if(d&&!d.error) s=d; }catch(_){}
  if(OPEN!==slug) return;                                  // closed / switched mid-fetch
  const c=ident(s), tier=s.effort||s.model||'';
  const kv=[
    kvrow('status',s.status),
    kvrow('engine',(s.engine||(s.status==='state_unreadable'?'unknown':'claude'))+(tier?' · '+tier:'')),
    kvrow('by',s.spawned_by),
    kvrow('project',s.project),

// Live filter by spawner ("farmer"): chips are built from whoever is ON THE BOARD right
// now — a spawner appears when it has agents and its chip disappears when it doesn't.
let FLEET=[], FILTER=null, SFILTER=null;
// status -> colour (mirrors the card status colours), and a sensible tab order
function statusColor(s){
  return ({running:'var(--accent)', starting:'var(--dim)', pr_open:'var(--ok)',
    done_no_pr:'var(--warn)', done:'var(--warn)', ended:'var(--warn)',
    failed:'var(--block)', state_unreadable:'var(--block)',
    killed:'var(--dim)'})[s] || 'var(--dim)';
}
const STATUS_ORDER=['running','starting','pr_open','done_no_pr','done','ended','failed','state_unreadable','killed'];
function fchip(attr,val,label,n,mark,on){
  const style=on?`border-color:${(mark&&mark.color)||'var(--accent)'}`:'';
  let dot='';
  if(mark&&mark.emoji) dot=`<span class="fdot" style="background:${mark.color}22;color:${mark.color}">${mark.emoji}</span>`;
  else if(mark&&mark.color) dot=`<span class="fsdot" style="background:${mark.color}"></span>`;

}
function renderFilters(){
  // cross-filter: spawner counts respect the active STATUS; status counts respect the active SPAWNER
  const forStatus = SFILTER ? FLEET.filter(s=>(s.status||'')===SFILTER) : FLEET;
  const bySpawn={};
  forStatus.forEach(s=>{const k=s.spawned_by||''; if(k)(bySpawn[k]||(bySpawn[k]={n:0,rep:s})).n++;});
  const sKeys=Object.keys(bySpawn).sort();
  if(FILTER && !sKeys.includes(FILTER)) FILTER=null;

  const forSpawn = FILTER ? FLEET.filter(s=>(s.spawned_by||'')===FILTER) : FLEET;
  const byStat={};
  forSpawn.forEach(s=>{const st=s.status||'?'; (byStat[st]||(byStat[st]={n:0})).n++;});
  const stKeys=Object.keys(byStat).sort((a,b)=>{
    const ia=STATUS_ORDER.indexOf(a), ib=STATUS_ORDER.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b);
  });
  if(SFILTER && !stKeys.includes(SFILTER)) SFILTER=null;

  const showSpawn=sKeys.length>=2, showStat=stKeys.length>=2;
  if(!showSpawn && !showStat){ $('filters').innerHTML=''; return; }

  let left='';
  if(showSpawn){
    left+=fchip('f','','All',forStatus.length,null,FILTER===null);
    sKeys.forEach(k=>left+=fchip('f',k,k,bySpawn[k].n,ident(bySpawn[k].rep),FILTER===k));
  }
  let right='';
  if(showStat){
    right+=fchip('s','','All',forSpawn.length,null,SFILTER===null);
    stKeys.forEach(k=>right+=fchip('s',k,k.replace(/_/g,' '),byStat[k].n,{color:statusColor(k)},SFILTER===k));
  }
  $('filters').innerHTML=`<div class="fgroup">${left}</div><div class="fspacer"></div><div class="fgroup">${right}</div>`;
}
function renderCards(){

    const f=[FILTER&&('by '+FILTER), SFILTER&&SFILTER.replace(/_/g,' ')].filter(Boolean).join(' · ');
    $('cards').innerHTML=`<div class="empty">${f?'no agents ('+esc(f)+')':'no agents running — spawn one from the orchestrator'}</div>`;

    const cost=s.cost_usd!=null?'$'+s.cost_usd.toFixed(3):'';
    const c=ident(s);
    return `<div class="card ${s.status||''}" data-slug="${s.slug}" style="border-left-color:${c.color}">
      <div class="top">

        <span class="st">${s.status||''}</span>

      <div class="meta">${s.project||''} · ${s.lane||''} · <b>${s.engine||(s.status==='state_unreadable'?'unknown':'claude')}</b>${(s.effort||s.model)?'/'+(s.effort||s.model):''} · ${ago(s.started_at)}${s.spawned_by?' · by '+s.spawned_by:''}${pr?' · '+pr:''}</div>

        ${s.ports?`<span class="chip">:${s.ports.vite}</span>`:''}
        ${cost?`<span class="chip">${cost}</span>`:''}

  _ciRenderDeferred=false;
  const active=document.activeElement;
  let focusToken=null;
  if(active&&$('ciPane').contains(active)){
    if(active.matches('.ci-card-toggle[data-ci-id]'))focusToken=['toggle',active.dataset.ciId];
    else if(active.matches('.cistage>summary'))focusToken=['stage',active.parentElement.dataset.logKey];
    else if(active.matches('.uncovered>summary'))focusToken=['gates',active.parentElement.dataset.gatesKey];
  }
  const logScroll=new Map(Array.from($('ciPane').querySelectorAll('.cilog[data-log-key]'))
    .map(node=>[node.dataset.logKey,node.scrollTop]));
  const running=Array.isArray(CI_QUEUE.running)?CI_QUEUE.running:[];
  const queued=Array.isArray(CI_QUEUE.queued)?CI_QUEUE.queued:[];
  const recent=Array.isArray(CI_QUEUE.recent)?CI_QUEUE.recent:[];
  CI_RUNS={};
  // "updated 11h ago" reads as live data that simply has not changed. It is not: when the CI
  // daemon is stopped nothing writes this file at all, and the age is measuring our own silence.
  const daemonDown=CI_QUEUE.daemon_alive===false;
  // The queue file's age and the OBSERVATIONS' age are different numbers: the cards are drawn from
  // a snapshot refreshed on its own schedule, so a fresh queue can carry minute-old verdicts about
  // what has landed and what has gone stale. Say so once it is old enough to mislead.
  const obsAge=Number.isFinite(CI_QUEUE.refresh_age)?CI_QUEUE.refresh_age:null;
  const obsNote=(obsAge!==null&&obsAge>60)?' · observations '+ago(Date.now()/1000-obsAge)+' old':'';
  $('ciUpdated').textContent=CI_ERROR?'queue unavailable · agents still live':
    daemonDown?'CI daemon stopped · start it with: fleet ci daemon start':
    (CI_QUEUE.updated?'updated '+ago(CI_QUEUE.updated)+' ago'+obsNote:'queue ready');
  $('ciUpdated').classList.toggle('warn',daemonDown&&!CI_ERROR);
  $('ciEmpty').hidden=ciHasRecords(running,queued,recent);
  $('ciEmpty').textContent=CI_ERROR&&!ciHasRecords(running,queued,recent)
    ?'CI queue is temporarily unavailable. Agents remain live.'
    :daemonDown?'The CI daemon is not running, so nothing is being verified.'
    :'Nothing queued or running.';
  for(const [name,list,kind] of [['Running',running,'running'],['Queued',queued,'queued'],['Recent',recent,'recent']]){
    $(('ci'+name+'Section')).hidden=!list.length;
    $('ci'+name+'Count').textContent=list.length;
    $('ci'+name).innerHTML=list.map((x,index)=>{
      const key=ciRecordKey(x,kind+'-'+index);
      CI_RUNS[key]=x;
      return ciCard(x,kind,key,OPENCI===key);
    }).join('');
  }
  $('ciRecentToggle').setAttribute('aria-expanded',String(RECENT_OPEN));
  $('ciRecent').hidden=!RECENT_OPEN;
  if(OPENCI&&!CI_RUNS[OPENCI])OPENCI=null;
  for(const node of $('ciPane').querySelectorAll('.cilog[data-log-key]')){
    if(logScroll.has(node.dataset.logKey))node.scrollTop=logScroll.get(node.dataset.logKey);
  }
  if(focusToken){
    const [type,key]=focusToken;
    let target=null;
    if(type==='toggle')target=Array.from($('ciPane').querySelectorAll('.ci-card-toggle[data-ci-id]'))
      .find(node=>node.dataset.ciId===key);
    if(type==='stage')target=Array.from($('ciPane').querySelectorAll('.cistage[data-log-key]'))
      .find(node=>node.dataset.logKey===key)?.querySelector('summary');
    if(type==='gates')target=Array.from($('ciPane').querySelectorAll('.uncovered[data-gates-key]'))
      .find(node=>node.dataset.gatesKey===key)?.querySelector('summary');
    if(target)target.focus({preventScroll:true});
  }
}

function renderAccounts(){
  const rows=((ACCOUNTS_DATA||{}).accounts)||[];
  const row=$('acctrow'); if(!row)return;
  row.hidden=!rows.length;
  if(!rows.length)return;
  const sev=p=>p==null?'':(p>=95?'bad':(p>=70?'warn':''));
  const fmt=p=>p==null?'—':p+'%';
  // live countdown to each window's reset, recomputed on the normal 3s tick
  const until=iso=>{
    if(!iso)return'';
    const ms=new Date(iso)-Date.now();
    if(!isFinite(ms)||ms<=0)return'↻ now';
    const m=Math.floor(ms/60000),h=Math.floor(m/60),d=Math.floor(h/24);
    return '↻ '+(d>0?d+'d '+(h%24)+'h':h>0?h+'h '+(m%60)+'m':m+'m');
  };
  // the real engine logos (Claude/OpenAI) the agent cards use, at .elogo size
  row.innerHTML=rows.map(a=>{
    const fable=(a.scoped||[]).find(s=>/fable/i.test(s.label||''));
    const fp=fable?fable.percent:null;
    const lim=(k,p,r)=>`<div class="alim"><span class="lk">${k}</span>`
      +`<span class="lv ${sev(p)}">${fmt(p)}</span>`
      +`<span class="lr">${until(r)}</span></div>`;
    const isCodex=a.engine==='codex';
    const name=(a.label||a.name||'').replace(/</g,'&lt;');
    // a stale tile keeps its numbers but says why they are old; 429 = throttled, not broken
    const staleNote=a.stale_error
      ?`<span class="lr" style="color:var(--warn)">${/expired/.test(a.stale_error)?'token expired':/429/.test(a.stale_error)?'rate-limited':'unreadable'}`
        +`${a.read_at?(' · data '+Math.round((Date.now()/1000-a.read_at)/60)+'m old'):''}</span>`
      :'';
    // codex: two windows (5h burst + weekly), no fable; the OpenAI mark. claude: three windows.
    const windows=isCodex
      ? lim('5h',a.session,a.session_resets)+lim('weekly',a.weekly,a.weekly_resets)
        +(a.limit_reached?`<div class="alim"><span class="lk">state</span><span class="lv bad">limit</span></div>`:'')
      : lim('session',a.session,a.session_resets)+lim('weekly',a.weekly,a.weekly_resets)
        +lim('fable',fp,fable&&fable.resets);
    return `<div class="tile"${a.stale_error?' style="opacity:.65"':''}><span class="k">${name}</span>`
      +`<div class="alims">${windows}</div>`
      +staleNote+(ELOGO[isCodex?'codex':'claude']||'')+`</div>`;
  }).join('');
}

// Resizable canvas. --card-w is the real grid-card minimum; the pane minimum
// adds its live CSS gutters and the browser's reserved scrollbar gutter.
const SPLIT_KEY='fleet.dashboard.split.v1', DEFAULT_SPLIT=.42, NUDGE=24;
let splitRatio=DEFAULT_SPLIT, dragPointer=null, dragOffset=0, dragStartX=0, dragMoved=false;
try{
  const saved=Number(localStorage.getItem(SPLIT_KEY));
  if(Number.isFinite(saved)&&saved>0&&saved<1)splitRatio=saved;
}catch(_){}
function cssNumber(name){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name))||0;}
function paneScrollbarWidth(pane){
  const style=getComputedStyle(pane);
  const borders=(parseFloat(style.borderLeftWidth)||0)+(parseFloat(style.borderRightWidth)||0);
  return Math.max(0,pane.offsetWidth-pane.clientWidth-borders);
}
function paneMin(){
  const scrollbar=Math.max(paneScrollbarWidth($('ciPane')),paneScrollbarWidth($('agentsPane')));
  document.documentElement.style.setProperty('--pane-scrollbar-w',scrollbar+'px');
  return cssNumber('--card-w')+2*cssNumber('--pane-gutter')+scrollbar;
}
function splitGeometry(){
  const split=$('fleetSplit'), box=split.getBoundingClientRect();
  const divider=$('splitter').getBoundingClientRect().width||cssNumber('--splitter-hit');
  const available=Math.max(0,split.clientWidth-divider), min=paneMin();
  return{box,left:box.left+split.clientLeft,available,min,lo:available?min/available:.5,hi:available?1-min/available:.5};
}
function applySplit(ratio,persist=false){
  const g=splitGeometry();
  const stacked=g.available<2*g.min;
  $('fleetSplit').classList.toggle('stacked',stacked);
  if(stacked){
    $('agentsPane').style.flexBasis='';
    $('splitter').setAttribute('aria-valuenow','50');
    return;
  }
  splitRatio=Math.max(g.lo,Math.min(g.hi,Number(ratio)||DEFAULT_SPLIT));
  $('agentsPane').style.flexBasis=(g.available*splitRatio)+'px';
  $('splitter').setAttribute('aria-valuemin',String(Math.round(g.lo*100)));
  $('splitter').setAttribute('aria-valuemax',String(Math.round(g.hi*100)));
  $('splitter').setAttribute('aria-valuenow',String(Math.round(splitRatio*100)));
  if(persist)try{localStorage.setItem(SPLIT_KEY,String(splitRatio));}catch(_){}
}
function splitFromClientX(x,offset,persist=false){
  const g=splitGeometry();
  if(!g.available)return;
  applySplit((x-offset-g.left)/g.available,persist);
}
$('splitter').addEventListener('pointerdown',e=>{
  if($('fleetSplit').classList.contains('stacked'))return;
  const handle=$('splitter').getBoundingClientRect();
  dragPointer=e.pointerId;
  dragOffset=e.clientX-handle.left;
  dragStartX=e.clientX;
  dragMoved=false;
  $('splitter').setPointerCapture(e.pointerId);
  $('splitter').classList.add('active');
  document.body.classList.add('resizing');
  e.preventDefault();
});
$('splitter').addEventListener('pointermove',e=>{
  if(e.pointerId===dragPointer){
    if(e.clientX!==dragStartX){
      dragMoved=true;
      splitFromClientX(e.clientX,dragOffset);
    }
    e.preventDefault();
  }
});
function stopSplit(e){
  if(e.pointerId!==dragPointer)return;
  if(e.type!=='pointercancel'&&e.clientX!==dragStartX)dragMoved=true;
  if(dragMoved){
    if(e.type==='pointercancel')applySplit(splitRatio,true);
    else splitFromClientX(e.clientX,dragOffset,true);
  }
  dragPointer=null;
  dragMoved=false;
  $('splitter').classList.remove('active');
  document.body.classList.remove('resizing');
}
$('splitter').addEventListener('pointerup',stopSplit);
$('splitter').addEventListener('pointercancel',stopSplit);
$('splitter').addEventListener('keydown',e=>{
  if($('fleetSplit').classList.contains('stacked'))return;
  const g=splitGeometry();
  let next=null;
  if(e.key==='ArrowLeft')next=splitRatio-NUDGE/g.available;
  if(e.key==='ArrowRight')next=splitRatio+NUDGE/g.available;
  if(e.key==='Home')next=g.lo;
  if(e.key==='End')next=g.hi;
  if(next!=null){applySplit(next,true);e.preventDefault();}
});
$('splitter').addEventListener('dblclick',e=>{applySplit(DEFAULT_SPLIT,true);e.preventDefault();});
if('ResizeObserver' in window)new ResizeObserver(()=>applySplit(splitRatio)).observe($('fleetSplit'));
else window.addEventListener('resize',()=>applySplit(splitRatio));
applySplit(splitRatio);
