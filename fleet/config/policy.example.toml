# Capacity policy for the fleet. Copy to ~/.config/fleet/policy.toml and tune.
# The spawn guard BLOCKS a new agent if any hard limit is exceeded.
#
# These are starting points, not facts about your machine. An agent is cheap while it
# thinks and expensive in short bursts (a front end build, a test run), so the floors
# are there to leave room for several bursts at once. Measure: watch free memory while
# the farm is busy, and take the throttle temperatures from your chips' documentation.
[limits]
ram_min_gb   = 6     # hard: block spawns when free RAM drops below this
gpu_temp_max = 87    # hard: block if GPU hotter than this (C), a little under throttling
cpu_temp_max = 92    # hard: block if CPU hotter than this (C), a little under throttling

warn_ram_gb   = 8    # soft: dashboard + orchestrator warn below this (above the hard floor)
warn_agents   = 15
warn_gpu_temp = 82   # amber above this; below it is normal under load
warn_cpu_temp = 85   # amber above this; below it is normal under load

# ── Power modes: hand the CPU back when you are using the machine ──────────────
# `fleet mode auto|full|soft|balanced|hard`. The farm's agents live in a systemd
# --user slice we cap live (no root, no restart). cpu_quota_pct = share of the WHOLE
# machine; cpu_weight = scheduler share when not capped (100 = default, lower = yields);
# allow_spawn = accept new agents. `auto` uses GPU load to pick full (idle) vs soft (gaming).
[mode]
auto_enter_gpu = 25   # GPU util % that reads as "someone is using this box" -> soft
auto_exit_gpu  = 10   # ...and below this...
auto_exit_hold = 60   # ...for this many seconds -> back to full (hysteresis, no yo-yo)

[mode.full]     # farm takes everything (default when idle)
cpu_quota_pct = 0     # 0 here means "uncapped" (a real 0% would freeze it)
cpu_weight    = 100
allow_spawn   = true
[mode.soft]     # yields to what you are doing but KEEPS working; what auto picks
cpu_quota_pct = 50
cpu_weight    = 40
allow_spawn   = true
[mode.balanced] # existing agents crawl, no new ones
cpu_quota_pct = 35
cpu_weight    = 20
allow_spawn   = false
[mode.hard]     # near-frozen; for work that wants the whole machine
cpu_quota_pct = 20
cpu_weight    = 10
allow_spawn   = false

# ── Commit identity for spawned lanes ─────────────────────────────────────────
# Each lane commits as its own author so a reviewer can tell the agents apart.
# `{agent}` is the lane's code name (`--by`, falling back to the lane name).
# Both keys are optional: with no table at all a lane commits as "<name> (agent)"
# <name@agents.local>. That address is deliberate rather than left to git. A box
# with no user.email configured would otherwise fail a lane's first commit with
# "unable to auto-detect email address", which reads as a broken agent; a box
# that has one would quietly re-author every lane commit as the operator.
# Set email_format if your deployment wants its own shape (and see MIGRATION.md
# if this farm was committing under a real address before).
[identity]
author_format = "{agent} (agent)"
# email_format = "you+{agent}@example.com"

# The mark a new code name is given on first sight: one glyph and one colour, held in
# $FLEET_CONFIG/codenames.json from then on, so every agent an orchestrator spawns
# carries the same mark. Uncomment to use your own set instead of the shipped one.
# glyphs  = ["●", "■", "▲", "◆"]
# colours = ["#5b8def", "#3fb950", "#d29922", "#a371f7"]

# ── Head office (agent-hq), optional ──────────────────────────────────────────
# A cross-agent coordination layer: one claim per branch, a pre-push guard that refuses
# a branch claimed by somebody else, and unread mail folded into a lane's first prompt.
# It needs the `hq` CLI on PATH first: no binary, no head office, whatever this says.
# With the binary present, `enabled = false` is the only way to switch it off. Delete the
# table and every spawn warns and keeps it ON, because a farm that has always run head
# office must not lose its claims and its mail to an upgrade. An off fleet installs no
# claims hook and adds no AGENT-HQ paragraph to a brief.
[hq]
enabled = true
