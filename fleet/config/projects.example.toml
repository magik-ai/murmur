# Registered projects. Copy to ~/.config/fleet/projects.toml (or use `fleet add-project`).
# Each project is a repo the fleet can spawn workers against; the worker grounds
# itself in that repo's own CLAUDE.md.
#
# Ports: each lane is handed base+slot for its dev server, its API and its e2e harness. The slot
# is the lowest one whose ports no running lane holds, so two running lanes never fight over a
# port. The bases are the project's own business; set them in [<project>.ports]. Without that
# table, fleet uses vite = port_base (5200 when that is not set either), api = 8100, e2e = 6100.
#
# The example below is commented out. install.sh copies this file to ~/.config/fleet/projects.toml
# as it stands, and a live table here would take the name that the README and the installers tell
# a new operator to register: `fleet add-project --name myproj` would then refuse it as already
# registered with different settings. Uncomment and edit, or run add-project and let it write the
# table for you.
#
# [myproj]
# repo      = "your-org/your-repo"
# path      = "~/work/myproj"
# branch    = "main"
# port_base = 5200        # the dev server base; [myproj.ports] vite_base wins over it
# # Optional command run after a clean `fleet group assemble`, from the temporary
# # integration worktree. It must exit non-zero to block the integration PR.
# # validation = "./scripts/validate.sh"
#
# [myproj.ports]
# vite_base = 5200
# api_base  = 8100
# e2e_base  = 6100
