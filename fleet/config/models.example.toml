# Fleet model catalog. Declarative: what models exist, what they're for, how to run them.
# Mutable runtime state (enabled/disabled, last health check, measured limits) lives separately
# in ~/.fleet/models-state.json and is set by `fleet models enable|disable|test` — so this file
# stays a clean description and the toggles never rewrite it.
#
# Fields per [model]:
#   label        human name for the catalog
#   engine       launcher path: "codex" | "claude" (native, existing) | "generic" (a CLI template)
#   role         when an orchestrator should pick it (the routing doctrine, one line)
#   quality      short quality-vs-Opus note for the catalog
#   caps         the subscription's real limits (so nobody is surprised)
#   default_on   whether it starts enabled before anyone toggles it
#   bin          (generic) the CLI binary
#   auth_env     (generic) env var the headless CLI reads for its subscription credential
#   run          (generic) the exact non-interactive invocation; {task} and {bin} are substituted
#   health       a tiny non-interactive prompt used to test the model on enable
#   tos          headless/automation ToS stance (why it's safe or risky for a farm)

[codex]
color      = "#10A37F"
label      = "Codex — GPT-5.6 Sol"
engine     = "codex"
role       = "frontier tier. QUOTA EXHAUSTED 08.08 — check before spawning; claude is the workhorse until it returns."
quality    = "frontier (~Opus-class agentic)"
caps       = "ChatGPT subscription; ran dry 08.08 — no longer the bottomless pool"
default_on = true
tos        = "first-party CLI on the ChatGPT subscription (auth_mode chatgpt)"

[claude]
color      = "#D97757"
label      = "Claude Code — Claude 5 family"
# every alias below verified headless on this farm; fable burns the weekly window
# faster than opus and has its own scoped promo limit - watch it on the front page
models     = "sonnet · opus · haiku · fable"
engine     = "claude"
role       = "the workhorse while codex is out. Pool is SHARED with the owner's own sessions — `fleet accounts` shows live headroom; spawn with --account auto."
quality    = "frontier — the bar (88.6% SWE-bench Verified)"
caps       = "Claude Max subscription; limits visible via `fleet accounts`, spread across accounts with --account"
default_on = true
tos        = "first-party CLI on the Anthropic OAuth subscription"

[qwen]
color      = "#7C5CFC"
label      = "Qwen Code — Alibaba Coding Plan"
engine     = "generic"
bin        = "qwen"
role       = "BULK tier behind a review gate: long, mechanical, verifiable work (sweeps, test backfill, inventory, boilerplate). Never architecture/security/migrations/money."
quality    = "~80% SWE-bench Verified (~8 pts under Opus) — Sonnet-adjacent; strong for well-specified grind"
caps       = "$50 Pro: flat request-quota 90k/mo · 45k/wk · 6k per 5h. No per-token, no forced overage."
default_on = false
auth_env   = "QWEN_CODE_API_KEY"
run        = "{bin} -p {task} --output-format stream-json"
health     = "Reply with exactly: OK"
tos        = "LOW — Qwen Code ships a documented headless mode; the Coding Plan is sold for agentic/CI use."

[kimi]
color      = "#6D5AE6"
label      = "Kimi Code — Kimi K3 (PREPARED, do not enable)"
engine     = "generic"
bin        = "kimi"
role       = "PREPARED ONLY. Its subscription ToS forbids non-interactive/scripted use (suspension risk) — see tos. Wired for completeness; keep OFF until a ToS-legal path exists."
quality    = "vendor-only 76.8% SWE-V (3-days-old, no independent confirmation)"
caps       = "Kimi Code plans $19–$199; shared weekly credit pool"
default_on = false
auth_env   = "KIMI_API_KEY"
run        = "{bin} -p {task} --output-format stream-json"
health     = "Reply with exactly: OK"
tos        = "HIGH / BLOCKED — 'subscriptions are for interactive use only'; scripted batch → account suspension. Do not run a headless fleet on the sub."
