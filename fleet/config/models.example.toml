# Fleet model catalog. Declarative: what models exist, what they're for, how to run them.
# Mutable runtime state (enabled/disabled, last health check, measured limits) lives separately
# in ~/.fleet/models-state.json and is set by `fleet models enable|disable|test`, so this file
# stays a clean description and the toggles never rewrite it.
#
# Fields per [model]:
#   label        human name for the catalog
#   engine       launcher path: "codex" | "claude" (native, existing) | "generic" (a CLI template)
#   role         when an orchestrator should pick it (the routing doctrine, one line)
#   quality      short quality-vs-Opus note for the catalog
#   caps         the subscription's real limits (so nobody is surprised)
#                A note about what a plan is doing TODAY (an exhausted quota, an outage) is
#                yours to keep in your own models.toml; nothing dated ships in this example.
#   default_on   whether it starts enabled before anyone toggles it
#   bin          (generic) the CLI binary
#   auth_env     (generic) env var the headless CLI reads for its subscription credential
#   run          (generic) the exact non-interactive invocation; {task} and {bin} are substituted
#   health       a tiny non-interactive prompt used to test the model on enable
#   tos          headless/automation ToS stance (why it's safe or risky for a farm)

[codex]
color      = "#10A37F"
label      = "Codex"
engine     = "codex"
role       = "frontier tier: architecture, security, migrations, anything where being wrong is expensive."
quality    = "frontier, Opus-class on agentic work"
caps       = "ChatGPT subscription; check the plan's own limits before leaning on it"
default_on = true
tos        = "first-party CLI on the ChatGPT subscription (auth_mode chatgpt)"

[claude]
color      = "#D97757"
label      = "Claude Code"
# The pool is SHARED with your own interactive sessions. `fleet accounts` shows the live
# headroom; spawn with --account auto to spread lanes across the accounts you have added.
models     = "sonnet, opus, haiku"
engine     = "claude"
role       = "the workhorse: most lanes, most of the time."
quality    = "frontier"
caps       = "Claude subscription; limits visible via `fleet accounts`"
default_on = true
tos        = "first-party CLI on the Anthropic OAuth subscription"

[qwen]
color      = "#7C5CFC"
label      = "Qwen Code"
engine     = "generic"
bin        = "qwen"
role       = "BULK tier behind a review gate: long, mechanical, verifiable work (sweeps, test backfill, inventory, boilerplate). Never architecture, security, migrations or money."
quality    = "a few points under the frontier tier; strong on well-specified grind"
caps       = "flat request quota per month, week and five-hour window; no per-token billing"
default_on = false
auth_env   = "QWEN_CODE_API_KEY"
run        = "{bin} -p {task} --output-format stream-json"
health     = "Reply with exactly: OK"
tos        = "LOW: a documented headless mode, and the plan is sold for agentic use."

[kimi]
color      = "#6D5AE6"
label      = "Kimi Code (PREPARED, do not enable)"
engine     = "generic"
bin        = "kimi"
role       = "PREPARED ONLY. Its subscription terms forbid non-interactive use, so a farm on that subscription risks suspension. Wired for completeness; keep OFF until a permitted path exists."
quality    = "vendor figures only, no independent confirmation"
caps       = "shared weekly credit pool"
default_on = false
auth_env   = "KIMI_API_KEY"
run        = "{bin} -p {task} --output-format stream-json"
health     = "Reply with exactly: OK"
tos        = "HIGH, BLOCKED: 'subscriptions are for interactive use only'; scripted batches risk account suspension. Do not run a headless fleet on that subscription."
