<!-- @dsCard group="Status" height=120 subtitle="A subscription window: name, rail, percent" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;padding:16px;background:var(--paper)}</style></head>
<body class="mm-root">
<div style="display:grid;gap:var(--space-2);max-width:340px">
  <div class="mm-limit"><span class="mm-limit__name">session</span><span class="mm-limit__rail"><i class="mm-limit__fill" style="width:10%"></i></span><span class="mm-limit__pct">10%</span></div>
  <div class="mm-limit" data-tone="wait"><span class="mm-limit__name">weekly</span><span class="mm-limit__rail"><i class="mm-limit__fill" style="width:88%"></i></span><span class="mm-limit__pct">88%</span></div>
  <div class="mm-limit" data-tone="fail"><span class="mm-limit__name">Fable</span><span class="mm-limit__rail"><i class="mm-limit__fill" style="width:100%"></i></span><span class="mm-limit__pct">100%</span></div>
</div>
</body>
</html>
